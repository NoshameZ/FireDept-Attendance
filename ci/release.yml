name: Release

# Push a tag like v2.0.1 to build, package and publish a GitHub Release.
# Installed copies of the app pick the new release up automatically on next start.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "Tag '$env:GITHUB_REF_NAME' is not a semantic version (expected vX.Y.Z)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "repo_url=https://github.com/$env:GITHUB_REPOSITORY" >> $env:GITHUB_OUTPUT

      - name: Run core tests
        run: dotnet run --project tests/FireDeptAttendance.Tests -c Release

      - name: Publish app
        run: >
          dotnet publish src/FireDeptAttendance/FireDeptAttendance.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:UpdateRepoUrl=${{ steps.ver.outputs.repo_url }}
          -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous release (for delta updates)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ steps.ver.outputs.repo_url }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer + update packages
        run: >
          vpk pack
          --packId FireDeptAttendance
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish
          --mainExe FireDeptAttendance.exe
          --packTitle "Fire Department Attendance Tracker"
          --icon src/FireDeptAttendance/app.ico

      - name: Create GitHub Release with assets
        run: >
          vpk upload github
          --repoUrl ${{ steps.ver.outputs.repo_url }}
          --publish
          --releaseName "Fire Dept Attendance v${{ steps.ver.outputs.version }}"
          --tag ${{ github.ref_name }}
          --token ${{ secrets.GITHUB_TOKEN }}
